services:
  # ─── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: fintrack-panama-api
    runtime: node
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false   # Set manually in Render dashboard after frontend deploy
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

databases:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  - name: fintrack-db
    databaseName: fintrack_panama
    user: fintrack
    plan: free
    region: oregon
