version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fintrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintrack_secret}
      POSTGRES_DB: ${DB_NAME:-fintrack_panama}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-fintrack}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintrack_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-fintrack}:${DB_PASSWORD:-fintrack_secret}@postgres:5432/${DB_NAME:-fintrack_panama}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 4000
      NODE_ENV: development
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
